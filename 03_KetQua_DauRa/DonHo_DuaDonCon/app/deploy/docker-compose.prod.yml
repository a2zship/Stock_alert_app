# Đón Hộ — chạy trên máy chủ: Postgres + app + Caddy (HTTPS tự động từ Let's Encrypt).
# Dùng: cd deploy && cp .env.prod.example .env && (sửa .env) && docker compose -f docker-compose.prod.yml up -d --build
name: donho-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: donho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong deploy/.env}
      POSTGRES_DB: donho
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donho -d donho"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Không mở cổng DB ra ngoài — chỉ app trong mạng nội bộ Docker truy cập.

  # Chạy một lần mỗi lần deploy: đồng bộ schema, nạp dữ liệu mẫu nếu SEED_DEMO=1 và DB còn trống.
  migrate:
    build: { context: .., target: tools }
    environment:
      DATABASE_URL: postgresql://donho:${POSTGRES_PASSWORD}@db:5432/donho
      SEED_DEMO: ${SEED_DEMO:-0}
    command: ["sh", "-c", "npx prisma db push --skip-generate && if [ \"$$SEED_DEMO\" = 1 ]; then npx tsx prisma/seed.ts --if-empty; fi"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  web:
    build: { context: .., target: runner }
    environment:
      DATABASE_URL: postgresql://donho:${POSTGRES_PASSWORD}@db:5432/donho
      APP_SECRET: ${APP_SECRET:?Đặt APP_SECRET (ít nhất 32 ký tự) trong deploy/.env}
      PUBLIC_URL: https://${DOMAIN:?Đặt DOMAIN trong deploy/.env}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      DEV_INBOX: ${DEV_INBOX:-0}
      PLATFORM_FEE_RATE: ${PLATFORM_FEE_RATE:-0.1}
      PLATFORM_BANK_BIN: ${PLATFORM_BANK_BIN:-}
      PLATFORM_BANK_ACCOUNT: ${PLATFORM_BANK_ACCOUNT:-}
      PLATFORM_ACCOUNT_NAME: ${PLATFORM_ACCOUNT_NAME:-}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
